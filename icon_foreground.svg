<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Device Body Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Key Shadow -->
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3C42"/>
      <stop offset="100%" stop-color="#222428"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18191C"/>
      <stop offset="100%" stop-color="#25272C"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#32343A"/>
      <stop offset="100%" stop-color="#26282D"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#484B52"/>
      <stop offset="50%" stop-color="#2A2C31"/>
      <stop offset="100%" stop-color="#1C1D21"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Main Calculator Body -->
    <rect x="116" y="66" width="280" height="380" rx="42" fill="url(#bodyGrad)" stroke="#4A4D55" stroke-width="2.5"/>
    <!-- Outer bezel inner shadow -->
    <rect x="120" y="70" width="272" height="372" rx="38" fill="none" stroke="#161719" stroke-width="2" opacity="0.8"/>

    <!-- Display Screen -->
    <rect x="140" y="96" width="232" height="80" rx="16" fill="url(#screenGrad)" stroke="#121315" stroke-width="2"/>
    <rect x="142" y="98" width="228" height="76" rx="14" fill="none" stroke="#3A3D45" stroke-width="1" opacity="0.5"/>
    
    <!-- Display Digit '0' -->
    <text x="345" y="155" font-family="sans-serif, Arial" font-size="52" font-weight="300" fill="#CBD5E1" text-anchor="end">0</text>

    <!-- Keypad Grid (4 columns x 4 rows) -->
    <!-- Col 0: x=140, Col 1: x=200, Col 2: x=260, Col 3: x=320 (width=52) -->
    <!-- Row 0: y=196, Row 1: y=256, Row 2: y=316, Row 3: y=376 (height=52) -->
    
    <!-- Keys Backgrounds -->
    <!-- Row 0: 7, 8, 9, ÷ -->
    <rect x="140" y="196" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="200" y="196" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="260" y="196" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="320" y="196" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>

    <!-- Row 1: 4, 5, 6, × -->
    <rect x="140" y="256" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="200" y="256" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="260" y="256" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="320" y="256" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>

    <!-- Row 2: 1, 2, 3, - -->
    <rect x="140" y="316" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="200" y="316" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="260" y="316" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="320" y="316" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>

    <!-- Row 3: 0, ., C, + -->
    <rect x="140" y="376" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="200" y="376" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="260" y="376" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>
    <rect x="320" y="376" width="52" height="52" rx="10" fill="url(#keyGrad)" stroke="#1A1B1E" stroke-width="1.5" filter="url(#keyShadow)"/>

    <!-- Key Labels -->
    <g font-family="sans-serif, Arial" font-size="22" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      <!-- Row 0 -->
      <text x="166" y="231">7</text>
      <text x="226" y="231">8</text>
      <text x="286" y="231">9</text>
      <text x="346" y="232" font-size="24">÷</text>

      <!-- Row 1 -->
      <text x="166" y="291">4</text>
      <text x="226" y="291">5</text>
      <text x="286" y="291">6</text>
      <text x="346" y="291" font-size="22">×</text>

      <!-- Row 2 -->
      <text x="166" y="351">1</text>
      <text x="226" y="351">2</text>
      <text x="286" y="351">3</text>
      <text x="346" y="349" font-size="26">−</text>

      <!-- Row 3 -->
      <text x="166" y="411">0</text>
      <text x="226" y="409" font-size="26">.</text>
      <text x="286" y="411">C</text>
      <text x="346" y="411" font-size="24">+</text>
    </g>

    <!-- Central Vault Wheel Lock (Centered over key grid junction at x=256, y=286) -->
    <g transform="translate(256, 286)">
      <!-- Outer shadow ring -->
      <circle cx="0" cy="0" r="44" fill="#121316" opacity="0.6"/>
      <!-- Outer metallic wheel ring -->
      <circle cx="0" cy="0" r="40" fill="url(#vaultGrad)" stroke="#5A5D66" stroke-width="3"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#18191C" stroke-width="2"/>
      
      <!-- 6 Radial Handles/Spokes -->
      <g stroke="url(#vaultGrad)" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="-44" x2="0" y2="-20"/>
        <line x1="0" y1="20" x2="0" y2="44"/>
        <line x1="-38" y1="-22" x2="-17" y2="-10"/>
        <line x1="17" y1="10" x2="38" y2="22"/>
        <line x1="-38" y1="22" x2="-17" y2="10"/>
        <line x1="17" y1="-10" x2="38" y2="-22"/>
      </g>
      
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="20" fill="#202226" stroke="#484B52" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#121315" stroke="#33353B" stroke-width="1.5"/>
    </g>
  </g>
</svg>
